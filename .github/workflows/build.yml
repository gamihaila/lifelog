name: Build multipage HTML

on:
  push:
    branches: [main]
    paths:
      - 'docs/**.md'
      - 'docs/contents.yaml'
      - 'docs/build_multipage.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install markdown

      - name: Run multipage build script
        working-directory: docs
        run: python3 build_multipage.py

      - name: Commit rebuilt html/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/html
          git diff --cached --quiet || git commit -m "Auto-rebuild multipage HTML"
          git push
